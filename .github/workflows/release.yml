name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - name: Check the tag matches the manifest version
        run: |
          manifest=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          tag="${GITHUB_REF_NAME#v}"
          test "$manifest" = "$tag" || {
            echo "tag $tag does not match manifest version $manifest" >&2
            exit 1
          }
      - name: Run tests
        run: cargo test --locked
      - name: Run tests with the datasets feature
        run: cargo test --locked --lib --features datasets
      - name: Log in to crates.io with an ephemeral token
        run: |
          token_url="${ID_TOKEN_REQUEST_URL#*api.github.com/}"
          jwt=$(curl -sS -f -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "https://api.github.com/$token_url")
          token=$(curl -sS -f -X POST https://crates.io/api/v1/tokens \
            -H "Content-Type: application/json" \
            -d "{
              \"claims\": {
                \"aud\": \"https://crates.io\",
                \"crates_io_user_id\": 211897,
                \"crates_io_scopes\": [\"publish_new_version:smiles-rs\"]
              },
              \"jwt\": \"$jwt\"
            }" | jq -r .token)
          test "$token" != "null" && test -n "$token" || {
            echo "crates.io refused the OIDC token request" >&2
            exit 1
          }
          cargo login "$token"
      - name: Publish
        run: cargo publish --locked
